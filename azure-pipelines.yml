# Azure DevOps Pipeline for WMS (Workforce Management System)
# Trigger: push / PR to main branch
# Stages: Backend (.NET 10) → Frontend (Angular) → Deploy Backend → Deploy Frontend

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

# ─────────────────────────────────────────────────────
# BACKEND STAGE
# ─────────────────────────────────────────────────────
- stage: Backend
  displayName: 🏗 Backend Build & Test

  jobs:
  - job: BuildBackend
    displayName: Build and Test .NET Solution

    steps:

    - task: UseDotNet@2
      displayName: Install .NET SDK 10.x
      inputs:
        packageType: sdk
        version: '10.0.x'
        includePreviewVersions: true

    - script: |
        cd WMS-Solution
        dotnet restore
      displayName: Restore NuGet packages

    - script: |
        cd WMS-Solution
        dotnet build --configuration Release --no-restore
      displayName: Build solution

    - script: |
        cd WMS-Solution
        dotnet test --configuration Release --no-build --logger trx
      displayName: Run unit tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testRunner: VSTest
        testResultsFiles: 'WMS-Solution/**/*.trx'
        mergeTestResults: true

    - script: |
        cd WMS-Solution
        dotnet publish WMS.API/WMS.API.csproj \
        --configuration Release \
        --output $(Build.ArtifactStagingDirectory)/backend \
        --no-build
      displayName: Publish backend files

    - task: ArchiveFiles@2
      displayName: Create backend ZIP package
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/backend'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend/wms-api.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: Upload backend artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
        ArtifactName: backend-drop


# ─────────────────────────────────────────────────────
# FRONTEND STAGE
# ─────────────────────────────────────────────────────
- stage: Frontend
  displayName: 🎨 Frontend Build

  jobs:
  - job: BuildFrontend
    displayName: Build Angular Application

    steps:

    - task: UseNode@1
      displayName: Install Node.js 22.x
      inputs:
        version: '22.x'

    - script: |
        cd wms-frontend
        npm install
      displayName: Install npm packages

    - script: |
        cd wms-frontend
        npm run build
      displayName: Build Angular app

    - task: PublishBuildArtifacts@1
      displayName: Upload frontend artifacts
      inputs:
        PathtoPublish: 'wms-frontend/dist/wms-frontend/browser'
        ArtifactName: frontend-drop


# ─────────────────────────────────────────────────────
# FRONTEND DEPLOYMENT STAGE
# ─────────────────────────────────────────────────────
- stage: DeployFrontend
  displayName: 🌐 Deploy Frontend
  dependsOn: Frontend

  jobs:
  - job: DeployApp
    displayName: Deploy Angular App

    steps:

    - download: current
      artifact: frontend-drop

    - task: AzureWebApp@1
      displayName: 'Deploy Frontend to Azure App Service'
      inputs:
        azureSubscription: 'AzureConnection'
        appName: 'wms-frontend-eeb2a5e5gdaybgaq'
        package: '$(Pipeline.Workspace)/frontend-drop'


# ─────────────────────────────────────────────────────
# BACKEND DEPLOYMENT STAGE
# ─────────────────────────────────────────────────────
- stage: DeployBackend
  displayName: 🚀 Deploy Backend
  dependsOn: Backend

  jobs:
  - job: DeployAPI
    displayName: Deploy WMS API

    steps:

    - download: current
      artifact: backend-drop

    - task: AzureWebApp@1
      displayName: 'Deploy Backend API to Azure App Service'
      inputs:
        azureSubscription: 'AzureConnection'
        appName: 'wms-api-mrunal-e8awhsawexaeh2gx'
        package: '$(Pipeline.Workspace)/backend-drop/wms-api.zip'